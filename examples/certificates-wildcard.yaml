# 1) Certificado por defecto del controlador de ingress: cubre *.zverp.com y
#    *.runboat.zverp.com. Con Traefik, lo referencia el TLSStore "default"
#    (defaultCertificate.secretName: wildcard-zverp-tls) en su namespace.
#    Con ingress-nginx sería --default-ssl-certificate=<ns>/wildcard-zverp-tls.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-zverp
  namespace: traefik
spec:
  secretName: wildcard-zverp-tls
  issuerRef:
    kind: ClusterIssuer
    name: zerossl-dns
  dnsNames:
    - "*.zverp.com"
    - "*.runboat.zverp.com"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
---
# 2) Wildcard de runboat en el secreto que ya referencian sus Ingress.
#    cert-manager sobrescribirá el secreto actual (renovado a mano).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-runboat
  namespace: runboat
spec:
  secretName: wildcard-runboat-tls
  issuerRef:
    kind: ClusterIssuer
    name: zerossl-dns
  dnsNames:
    - "*.runboat.zverp.com"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
